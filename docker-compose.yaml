services:
  nginx:
    image: nginx:1.29-alpine
    container_name: nginx
    restart: unless-stopped
    labels:
      - coolify.application.subType=service
    environment:
      - SERVICE_FQDN_NGINX
    depends_on:
      - application
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  application:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spring-app
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    labels:
      - coolify.application.subType=service
    environment:
      - DB_NAME=${MYSQL_DATABASE:-appdb}
      - DB_USER=${SERVICE_USER_MYSQL}
      - DB_PASSWORD=${SERVICE_PASSWORD_MYSQL}
      - DB_TIMEZONE=${TIMEZONE:-America/Sao_Paulo}
      - JWT_SECRET=${SERVICE_PASSWORD_JWT_SECRET}
      - EXPIRATION_TIME=${JWT_EXPIRATION_TIME:-3600000}

  database:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    labels:
      - coolify.application.subType=database
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-appdb}
      - MYSQL_USER=${SERVICE_USER_MYSQL}
      - MYSQL_PASSWORD=${SERVICE_PASSWORD_MYSQL}
      - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_ROOT_MYSQL}
      - TIMEZONE=${TIMEZONE:-America/Sao_Paulo}
    command:
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: