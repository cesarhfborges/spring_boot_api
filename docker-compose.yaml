services:
  nginx:
    image: nginx:1.29-alpine
    container_name: nginx
    restart: unless-stopped
    labels:
      - coolify.managed=true
      - coolify.type=service
      - coolify.application.subType=service
    environment:
      - SERVICE_URL_VOTACAO-SERVICE_80
    depends_on:
      - votacao
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  votacao:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: votacao
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    labels:
      - coolify.proxy=false
      - coolify.managed=false
      - coolify.type=service
      - coolify.application.subType=service
    environment:
      - SERVICE_URL_VOTACAO-SERVICE_80
      - DB_NAME=${MYSQL_DATABASE:-appdb}
      - DB_USER=${SERVICE_USER_MYSQL-DATABASE}
      - DB_PASSWORD=${SERVICE_PASSWORD_MYSQL-DATABASE}
      - DB_TIMEZONE=${TIMEZONE:-America/Sao_Paulo}
      - JWT_SECRET=${SERVICE_PASSWORD_APPLICATION}
      - EXPIRATION_TIME=${JWT_EXPIRATION_TIME:-3600000}
    healthcheck:
      test: [ 'CMD', 'curl', '-f', 'http://127.0.0.1:8080']
      interval: 5s
      timeout: 20s
      retries: 10

  database:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    labels:
      - coolify.application.subType=database
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-appdb}
      - MYSQL_USER=${SERVICE_USER_MYSQL-DATABASE}
      - MYSQL_PASSWORD=${SERVICE_PASSWORD_MYSQL-DATABASE}
      - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_64_ROOT-DATABASE}
      - TIMEZONE=${TIMEZONE:-America/Sao_Paulo}
    command:
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: