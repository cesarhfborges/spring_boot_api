spring:
  application:
    name: api
    version: 1.0.0
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:3306/${DB_NAME:votacao}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=${DB_TIMEZONE:America/Sao_Paulo}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: HikariPool-1
      minimum-idle: 2
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      auto-commit: true
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        connection:
          isolation: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  sql:
    init:
      mode: never
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  forward-headers-strategy: framework
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 1024
    mime-types:
      - application/json
      - application/xml
      - text/html
      - text/plain
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  port: 8080
  address: 0.0.0.0
  error:
    include-stacktrace: never
    include-message: never

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}

api:
  security:
    token:
      secret: ${JWT_SECRET}
      expiration-time: ${EXPIRATION_TIME:3600000}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    defaultModelsExpandDepth: -1
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: INFO