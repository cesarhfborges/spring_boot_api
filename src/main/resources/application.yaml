spring:
  application:
    name: api
    version: 1.0.0
  datasource:
    url: jdbc:mysql://database:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=${TIMEZONE}
    username: ${SERVICE_USER_MYSQL}
    password: ${SERVICE_PASSWORD_MYSQL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: HikariPool-1
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 300000        # 5 minutos
      max-lifetime: 1800000       # 30 minutos
      connection-timeout: 30000   # 30 segundos
      auto-commit: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        show_sql: true
        connection:
          isolation: 2
  sql:
    init:
      mode: never

server:
  servlet:
    #    context-path: /api
    encoding:
      charset: UTF-8
  port: 8080
  address: 0.0.0.0

api:
  security:
    token:
      secret: YXJvbWFkb2NvZGlzb3JlY2Vpc2RlYXBpc3ByaW5nYm9vdGNvbWp3dGlzYmVzdGNoYXJzZXQ=
      #      secret: ${JWT_SECRET:YXJvbWFkb2NvZGlzb3JlY2Vpc2RlYXBpc3ByaW5nYm9vdGNvbWp3dGlzYmVzdGNoYXJzZXQ=}
      expiration-time: 3600000

springdoc:
  swagger-ui:
    defaultModelsExpandDepth: -1
    path: /swagger-ui