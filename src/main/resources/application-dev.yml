spring:
  application:
    name: api
    version: 1.0.0
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:mysql://localhost:3306/api_spring
    username: cesar
    password: 91344356
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: HikariPool-1
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 300000        # 5 minutos
      max-lifetime: 1800000       # 30 minutos
      connection-timeout: 30000   # 30 segundos
      auto-commit: true
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        connection:
          isolation: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  sql:
    init:
      mode: never
server:
  shutdown: immediate
  compression:
    enabled: true
    min-response-size: 1024
    mime-types:
      - application/json
      - application/xml
      - text/html
      - text/plain
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  port: 8080
  address: 0.0.0.0
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,http://localhost:4200,http://192.168.1.100:8081}

api:
  security:
    token:
      secret: YXJvbWFkb2NvZGlzb3JlY2Vpc2RlYXBpc3ByaW5nYm9vdGNvbWp3dGlzYmVzdGNoYXJzZXQ=
      expiration-time: 3600000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    defaultModelsExpandDepth: -1
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never